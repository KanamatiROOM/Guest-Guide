function setLang(k,scroll){
if(!L[k])k='ja';
render(k);
Array.prototype.forEach.call(document.querySelectorAll('.bar button'),function(b){b.setAttribute('aria-pressed',b.getAttribute('data-l')===k?'true':'false')});
try{localStorage.setItem('kanamachi-lang',k)}catch(e){}
try{history.replaceState(null,'','#'+k)}catch(e){}
if(scroll)window.scrollTo(0,0);
}
document.querySelector('.bar').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setLang(b.getAttribute('data-l'),true)});
document.getElementById('app').addEventListener('click',function(e){
var b=e.target.closest('.copy');if(!b)return;
var v=b.getAttribute('data-c'),k=document.documentElement.getAttribute('lang');
var done=function(){var old=b.textContent;b.textContent=(k==='en'?L.en:k==='ja'?L.ja:L.zh).copied;setTimeout(function(){b.textContent=old},1500)};
try{navigator.clipboard.writeText(v).then(done,function(){})}catch(err){}
});
var start='ja';
try{var h=location.hash.slice(1);if(L[h])start=h;else{var s=localStorage.getItem('kanamachi-lang');if(L[s])start=s;else{var n=(navigator.language||'').toLowerCase();start=n.indexOf('zh')===0?'zh':n.indexOf('ja')===0?'ja':n.indexOf('en')===0?'en':'ja'}}}catch(e){}
setLang(start,false);
</script>
